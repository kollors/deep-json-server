name: Publish package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Select release
        id: release
        run: node scripts/prepare-release.js
      - if: steps.release.outputs.publish == 'true'
        run: npm ci
      - name: Create alpha tag
        if: steps.release.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - name: Publish to the version channel
        if: steps.release.outputs.publish == 'true'
        env:
          GITHUB_REF_NAME: ${{ steps.release.outputs.tag }}
        run: node scripts/publish-package.js
