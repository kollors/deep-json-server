name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          node --input-type=module --eval "import packageJson from './package.json' with { type: 'json' }; if (process.env.GITHUB_REF_NAME !== 'v' + packageJson.version) throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + packageJson.version)"
      - run: npm run verify
      - run: npm publish
