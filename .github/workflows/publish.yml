name: Publish package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select release
        id: release
        run: node scripts/prepare-release.js

  verify:
    needs: release
    uses: ./.github/workflows/verify.yml

  publish:
    needs: [release, verify]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Create version tag
        if: needs.release.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
      - name: Publish to the version channel
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/publish-package.js
